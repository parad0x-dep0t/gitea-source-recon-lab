[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teahound"
version = "0.1.0"
description = "Fast, CTF-focused static analysis & source code reconnaissance tool for Gitea repositories."
readme = "README.md"
authors = [{ name = "Shubham Maurya" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0"
]
keywords = ["gitea", "reconnaissance", "ctf", "static-analysis", "security", "sast"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.scripts]
teahound = "scanner:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"*" = ["rules.yaml"]
